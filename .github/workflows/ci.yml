name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # `-m 'not llm'` is the default in pyproject: CI never calls a model.
      - name: Test
        run: python -m pytest --cov=iriguchi --cov-report=term-missing
        env:
          PYTHONUTF8: "1"

  # Zero runtime dependencies is a claim, so it is checked rather than stated.
  # Install the wheel with no extras into a clean environment and assert that
  # nothing came along with it.
  no-dependencies:
    name: zero runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install with no extras
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Assert nothing else is installed
        run: |
          python - <<'PY'
          import importlib.metadata as md
          allowed = {"iriguchi", "pip", "setuptools", "wheel"}
          extra = sorted(
              d.metadata["Name"]
              for d in md.distributions()
              if d.metadata["Name"] and d.metadata["Name"].lower() not in allowed
          )
          assert not extra, f"iriguchi pulled in runtime dependencies: {extra}"
          print("no runtime dependencies")
          PY

      - name: Import it
        run: python -c "import iriguchi; print(iriguchi.__version__)"

      # `pip install iriguchi` pulls nothing, and this job proves it. What the
      # consumer receives is the same axis, and until today they received zero
      # dependencies AND zero type information -- only the first deliberate.
      #
      # Checked here rather than in the test suite because this is the only job
      # holding the artefact a consumer actually installs. A `py.typed` sitting
      # in `src/` that the wheel omits looks identical from inside the
      # repository and is worth nothing from outside it -- which is the state
      # three sibling projects were measured in today.
      #
      # mypy is installed *after* the dependency assertion above, which would
      # otherwise count it. The order is load-bearing.
      - name: A consumer can see the types
        run: |
          python - <<'PY'
          import importlib.resources as r
          assert r.files("iriguchi").joinpath("py.typed").is_file(), (
              "py.typed did not reach the installed package. Without it PEP 561 "
              "says a consumer's type checker skips iriguchi entirely."
          )
          print("py.typed is in the installed package")
          PY
          python -m pip install mypy
          cat > consumer.py <<'PYFILE'
          from iriguchi.domain.destination import Destination

          wrong: int = Destination.LOCAL
          gone: int = Destination.NO_SUCH_MEMBER
          PYFILE
          python -m mypy --strict consumer.py > out.txt 2>&1 || true
          cat out.txt
          # An exit code is evidence only once something has been shown to make
          # it move, and both codes can arrive without the check running. So the
          # specific diagnostics are required by name. Before the marker existed
          # this file produced "Success: no issues found".
          grep -q 'has no attribute "NO_SUCH_MEMBER"' out.txt
          grep -q 'expression has type "Destination", variable has type "int"' out.txt
          if grep -q 'missing library stubs or py.typed marker' out.txt; then
            echo "the marker is not reaching the consumer"
            exit 1
          fi

      # The other half of the mamori-is-optional promise. There is genuinely no
      # mamori in this environment, so this is stronger than the import-blocking
      # fixture in tests/test_mamori_absent.py -- and weaker in one way, since it
      # cannot assert on behaviour. Both are wanted.
      - name: Drive the CLI with no mamori and no corpus dependencies
        run: |
          iriguchi doctor
          iriguchi --local --external route "田中さんに tanaka@example.com で連絡"
          iriguchi --local --external eval
        env:
          PYTHONUTF8: "1"

      - name: Asking for mamori without mamori must fail loudly
        run: |
          if iriguchi --local --scanner mamori route "hello"; then
            echo "expected a failure, got success" && exit 1
          fi
        env:
          PYTHONUTF8: "1"

  seam:
    name: the mamori seam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mamori is not on PyPI, so there is no `siblings` extra to install -- a
      # manifest naming a package nobody can fetch is a broken install rather
      # than an optional feature. (`pyproject.toml` cannot carry a direct git
      # reference either: hatchling refuses to build one without
      # `allow-direct-references`, and setting that flag to clear the error gets
      # the distribution rejected at upload instead. If a PR ever adds that
      # flag, that is what it is doing.)
      #
      # **Pinned, and the pin is the point.** Unpinned, this job's result
      # depends on when it ran, and a re-run that turns red into green is not a
      # check. Pinned, a mamori release cannot reach this build at all -- so the
      # tolerance that would otherwise be needed stops being needed, rather than
      # covering something up.
      #
      # And the bump commit is the notification. Six libraries moving
      # independently means nobody notices a producer moving; raising this sha
      # turns that into a commit somebody has to look at, with the seam tests
      # running against the new one before it lands.
      - uses: actions/checkout@v7
        with:
          repository: Nananananana/mamori
          # Raised from dd9e486 (0.26.0) because the pinned one predated
          # `Carried, not stated: surrogates get their own contract identifier`.
          # **CI was verifying iriguchi against a contract mamori no longer
          # publishes** -- the pin held the seam still and held it in the past,
          # and a pin nothing re-examines is a fixture rather than a version.
          # The conformance tests are what noticed; they fail when this sha's
          # schema and iriguchi's reader describe different documents.
          ref: f791ba07869585c7666d312bb967e78117ba56f4  # 0.27.0
          path: .sibling-mamori

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install both
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ./.sibling-mamori

      # **The step that stops this job from being decoration.** Everything in
      # tests/test_mamori_scanner.py is gated on mamori being importable, so a
      # job where the install quietly failed runs zero tests and reports green.
      # That is the shape this file has spent the day removing, and a sibling
      # job is the easiest place to reintroduce it.
      #
      # `mamori_state()` distinguishes absent from broken, so the failure says
      # which happened.
      - name: The sibling has to actually be there
        run: |
          python -c "
          from iriguchi.infrastructure.scanners.mamori_scanner import SiblingState, mamori_state
          state, detail = mamori_state()
          assert state is SiblingState.AVAILABLE, (
              f'this job exists to run the seam tests and mamori is {state.value}. '
              f'{detail} Every test it was meant to run would have skipped, and '
              'this job would have reported success.')
          import mamori; print('mamori', mamori.__version__)
          "
        env:
          PYTHONUTF8: "1"

      # No `continue-on-error`, anywhere in this job, and the pin is why.
      #
      # The earlier version tolerated failure here so that a mamori release
      # could not block an unrelated merge. With the sha pinned, a mamori
      # release cannot reach this job at all, so a failure means *iriguchi*
      # broke the seam against a mamori that has not moved -- which is exactly
      # the finding that should stop a merge.
      #
      # Removing the need for tolerance beats tolerating: tsumugi's equivalent
      # job carried `continue-on-error` at the job level and spent an unknown
      # period failing to install mamori at all while reporting success.
      # **The whole suite, not a list of files.** The first version of this step
      # named `tests/test_mamori_scanner.py`, which was the only mamori-gated
      # file when it was written. Adding `tests/test_escalation_channel.py`
      # meant 54 tests that skip everywhere else ran nowhere at all -- the same
      # silence this job was created to remove, reintroduced by the fix for it.
      #
      # A step that enumerates files drifts the moment a file is added. Running
      # everything cannot: the other jobs run this suite without mamori, this
      # one runs it with, and the difference between them is the seam.
      - name: The seam
        run: python -m pytest -q
        env:
          PYTHONUTF8: "1"

      # The numbers in docs/measurements.md were taken on a developer's machine.
      # This is where they become reproducible by somebody who is not that
      # developer.
      - name: What installing mamori buys, measured here
        run: |
          iriguchi --local --external eval
          iriguchi --local --external --scanner mamori eval
        env:
          PYTHONUTF8: "1"

  lint:
    name: lint, types and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy

      # **The console script, not `python -m importlinter.cli`.** The module form
      # prints nothing and exits 0 whatever the contracts say -- verified against
      # a real `domain -> ports` violation, which the console script catches with
      # exit 1 and the module form passes in silence. This step had therefore
      # never checked anything, including `Only the adapters may know about
      # mamori`, which is the contract two of this week's changes were written to
      # protect.
      #
      # `tests/test_ci_gates.py` keeps the module form from coming back.
      - name: Import contracts
        run: lint-imports

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip pip-audit && python -m pip install -e ".[dev]"

      # iriguchi itself is installed editable and is not on PyPI, so it cannot
      # be audited and has to be skipped. --strict would then fail on that skip
      # rather than on a vulnerability, so it is left off: pip-audit still exits
      # non-zero whenever a dependency has a known advisory.
      - name: Audit
        run: python -m pip_audit --skip-editable
