[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iriguchi"
version = "0.1.0.dev0"
description = "Local-first governance router for generative AI. Decide where each prompt is allowed to go -- locally, deterministically, and before anything leaves the machine."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nananananana" }]
keywords = ["llm", "routing", "privacy", "local-first", "slm", "governance", "japanese"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

# Zero. Not "few". See docs/adr/0001-the-domain-depends-on-nothing.md -- this
# library sees every prompt a person types before anything else does, and every
# runtime dependency is code with unsupervised read access to all of it.
dependencies = []

# **One list, and this is it.** `uv add --dev` writes to `[dependency-groups]`,
# which is PEP 735 and which `pip install .[dev]` does not read -- so a package
# added that way is present locally, absent in CI, and the failure is an
# `ImportError` in a job nobody was touching. Two things named `dev` that mean
# different things, with the tooling reading one each.
[project.optional-dependencies]
# Microsoft Presidio (MIT). The first scanner worth having that a user can
# actually install -- mamori is not on PyPI (docs/feasibility.md F2), and until
# it is, the built-in fallback's 63.5% miss rate had no followable remedy.
#
# An extra rather than a dependency: `pip install iriguchi` still pulls nothing,
# and the `zero runtime dependencies` job proves it by installing the wheel with
# no extras at all. Presidio brings spaCy and wants a language model of a few
# hundred megabytes, which is a fair price for detection and an unfair one for a
# router somebody wanted to read in an afternoon.
presidio = ["presidio-analyzer>=2.2"]

dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6.90",
    "ruff>=0.16",
    "mypy>=1.10",
    "import-linter>=2",
    "pre-commit",
    # Validates `iriguchi.routing-decision/1` against the schema the wheel
    # ships. Development-only; the `zero runtime dependencies` job proves that
    # separately by installing the wheel with no extras at all.
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
]

# There is deliberately no `siblings` extra yet. mamori is not on PyPI, so
# declaring `mamori>=0.24` here makes the whole project unresolvable for
# everyone -- a manifest that names a package nobody can fetch is a broken
# install, not an optional feature. Until it is published, the seam is exercised
# by installing it from a checkout:
#
#     uv pip install -e ../mamori
#
# The integration tests `importorskip` it, so its absence skips rather than
# fails, and an import contract asserts nothing outside an adapter names it.

[project.urls]
Homepage = "https://github.com/Nananananana/iriguchi"
Repository = "https://github.com/Nananananana/iriguchi"
Issues = "https://github.com/Nananananana/iriguchi/issues"
Changelog = "https://github.com/Nananananana/iriguchi/blob/main/CHANGELOG.md"

[project.scripts]
iriguchi = "iriguchi.interfaces.cli.main:main"

[tool.hatch.build.targets.wheel]
# `src/iriguchi/py.typed` needs no entry of its own: hatchling ships everything
# under a listed package directory. That it *arrives* is asserted in the wheel
# job, not here -- a marker present in the repository and absent from the wheel
# looks identical from inside and is worth nothing from outside.
packages = ["src/iriguchi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not llm'"

# **An empty `parametrize` is a collection error, not a silent skip.**
#
# pytest's default is to mark an empty parameter set `skip`, so a
# `@pytest.mark.parametrize("path", ALL_FILES)` whose list came back empty
# collects nothing and the run stays green. Every architecture guard here is
# built that way -- the files come from a glob -- so a renamed package or a
# typo in a root would retire the whole layer check without a word.
#
# Demonstrated before this line existed: pointing `PACKAGE_ROOT` at a directory
# that does not exist left the layering, the domain purity and the
# sibling-optionality checks collecting zero tests each.
empty_parameter_set_mark = "fail_at_collect"
markers = [
    # Tests that call a real local model. Excluded from CI, because a build
    # that depends on a model having been pulled is a build that fails for
    # reasons unrelated to the change. Run `pytest -m llm` before merging
    # anything model-adjacent.
    "llm: requires a running local model",
    # Opts a test out of the autouse network poisoning in tests/conftest.py.
    # Nothing in v0.1 uses it; it exists so that v0.2's adapters make their
    # exception visible per test rather than by relaxing the default.
    "network: may use a real socket",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "S", "RUF"]
ignore = [
    "S101",   # assert: this is a test suite convention
    # Full-width and CJK characters are the subject matter, not a typo. The
    # complexity estimator reads script mix, and half the routing corpus is
    # Japanese, so both forms appear in code, docstrings and fixtures on
    # purpose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
# `src` alone left `tests/` and `tools/` unchecked, and the two worst places for
# that are exactly the two this project's rules lean hardest on: the generator
# that writes the corpus, and the tool that produces a published number. Both
# had a real error sitting in them, found by running mypy wider than CI does.
# A narrower spelling of a check fails silently by construction -- mamori learned
# the same thing when `ruff format --check src tests` passed while three READMEs
# drifted and main was red for three commits.
files = ["src/iriguchi", "tests", "tools", "examples"]
strict = true
warn_unreachable = true

# mamori is an optional adapter dependency and is deliberately absent from CI --
# that absence is the thing the `zero runtime dependencies` job exists to prove.
# Its imports in `infrastructure/scanners/mamori_scanner.py` are all inside
# functions and guarded, but mypy pinned to an environment without the package
# cannot see a module that is not there.
#
# What this costs: the adapter's calls into mamori are not type-checked. They are
# checked by `tests/test_mamori_scanner.py`, which runs against the real mamori
# and is skipped where it is absent -- so that checking happens on a developer's
# machine and not in CI. Worth knowing before changing that file.
# `tools/measure_memory.py` is a Windows probe and says so three times over: its
# docstring, `main()`'s platform guard, and the environment line in
# `docs/measurements.md`. **The lint job runs on Linux**, where `ctypes.WinDLL`
# is absent from the stubs and everything past the guard is correctly dead code.
#
# Excluding the file would reopen the hole widening `files` just closed, so it
# stays in scope with exactly two codes off.
#
# What this costs: a genuine typo in a `ctypes` attribute name in that file --
# `WinDLLL` -- would now be caught on Windows and not on Linux, and the lint job
# is the Linux one. The file's own numbers are reproduced by running it, which
# only happens on Windows, so that is where the mistake would surface.

[[tool.mypy.overrides]]
module = "measure_memory"
disable_error_code = ["attr-defined", "unreachable"]

[[tool.mypy.overrides]]
module = "mamori.*"
ignore_missing_imports = true

# Optional adapters, both absent from the type-check environment on purpose:
# checking against a library that is installed here and not for a user is how a
# `[presidio]` extra grows a hard dependency nobody notices. `spacy` arrives
# with presidio-analyzer and is named separately because the download guard
# imports it directly.
[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "spacy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/iriguchi"]
