# Keep this fast. A hook that makes committing slow gets bypassed, and a
# bypassed hook protects nothing. Type checking, the import contracts and the
# tests run in CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
      # A router sees every prompt a person types. Nothing it captured while
      # someone was debugging it may reach a commit.
      - id: detect-private-key
